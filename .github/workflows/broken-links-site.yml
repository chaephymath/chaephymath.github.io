name: Check for broken links on site

on:
  workflow_run:
    workflows: [Deploy site]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links-on-site:
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#running-a-workflow-based-on-the-conclusion-of-another-workflow
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      # Inspect the files produced by the successful deployment, without rebuilding.
      - name: Checkout deployed site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _site
          persist-credentials: false
      - name: Verify site output exists
        run: test -s _site/index.html
      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          fail: true
          # only check local links
          args: --offline --base '${{ github.workspace }}/_site' --verbose --no-progress '_site/**/*.html'
