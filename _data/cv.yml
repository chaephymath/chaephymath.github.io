    Research Experience:
      - company: Computational Study of Pseudomodular Fuchsian Groups
        bullet: >-
          **Computational Study of Pseudomodular Fuchsian Groups** — Research Internship, advised by
          Prof. Gye-Seon Lee at the SNU Department of Mathematical Sciences (March–August 2026). Studied rational
          cusp sets, arithmeticity, and commensurability; developed Python/SymPy calculations for trace-based
          arithmeticity tests, rational fixed-point searches, and killer-interval coverings; and reproduced
          computational certificates for Δ(2/5, 4), Δ(3/7, 4), and Δ(3/11, 4).
        position: Research Internship
        location: SNU, Seoul, South Korea
        start_date: 2026-03
        end_date: 2026-08
        summary: >-
          Advised by Prof. Gye-Seon Lee. Studied the construction of pseudomodular Fuchsian groups through Long–Reid’s “Pseudomodular
          Surfaces,” focusing on rational cusp sets, arithmeticity, and commensurability. Developed
          Python/SymPy calculations for trace-based arithmeticity tests, rational fixed-point searches, and
          killer-interval coverings. Reproduced computational certificates for Δ(2/5, 4) and Δ(3/7, 4), and
          performed an appendix-guided verification for Δ(3/11, 4). Documented the methods and results in an
          undergraduate research internship report.
        highlights:
          - >-
            Studied constructions of pseudomodular Fuchsian groups and the relationship between rational cusp
            sets, arithmeticity, and commensurability.
          - >-
            Developed Python/SymPy computations to reproduce trace-based arithmeticity tests, detect rational
            fixed points of hyperbolic elements, and construct killer-interval coverings.
          - >-
            Reproduced computational certificates for the pseudomodularity of Δ(2/5, 4) and Δ(3/7, 4), with an
            appendix-guided verification for Δ(3/11, 4); documented the work in an internship report.
      - company: Local Well-Posedness of Incompressible Euler Equations on Singular Domains
        bullet: >-
          **Local Well-Posedness of Incompressible Euler Equations on Singular Domains** — Research Internship,
          advised by Prof. Injee Jeong (currently at KIAS) at Seoul National University (March–August 2025).
          Investigated velocity–pressure methods, Sobolev energy estimates, pressure regularity, boundary
          compatibility, and elliptic regularity in the whole space, half-space, and domains with corners.
        position: Research Internship
        location: SNU, Seoul, South Korea
        start_date: 2025-03
        end_date: 2025-08
        summary: >-
          At SNU, advised by Prof. Injee Jeong (now at KIAS). Investigated local well-posedness of the
          incompressible Euler equations in Sobolev spaces via
          velocity–pressure methods. Studied energy estimates and pressure regularity in the whole space,
          half-space, and domains with corners, including boundary compatibility and elliptic regularity issues.
          Prepared a research report and presented the work.
        highlights:
          - >-
            Investigated local well-posedness of incompressible Euler equations via velocity–pressure methods
            and Sobolev estimates.
          - >-
            Studied energy and pressure estimates in whole-space, half-space, and corner domains, including
            boundary-regularity issues.

