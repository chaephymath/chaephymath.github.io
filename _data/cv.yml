    Research Interests:
      - name: Nonlinear PDEs and Fluids
        bullet: >-
          **Nonlinear PDEs and Fluids** — Existence, regularity, and nonlinear dynamics of fluid equations,
          particularly the Euler equations, with attention to the effects of boundaries and singular geometry.
        icon: fa-solid fa-water
        summary: >-
          Existence, regularity, and nonlinear dynamics of fluid equations, particularly the Euler equations,
          with attention to the effects of boundaries and singular geometry.
      - name: Hyperbolic Geometry and Geometric Group Theory
        bullet: >-
          **Hyperbolic Geometry and Geometric Group Theory** — Discrete group actions on hyperbolic spaces,
          especially Fuchsian groups, and how algebraic properties are reflected in geometry, topology, and dynamics.
        icon: fa-solid fa-shapes
        summary: >-
          Discrete group actions on hyperbolic spaces, especially Fuchsian groups, and how group-theoretic and
          representation-theoretic properties are reflected in geometry, topology, and dynamics.
      - name: Quantum Field Theory and Gravitation
        bullet: >-
          **Quantum Field Theory and Gravitation** — Relations between quantum field theory and spacetime
          geometry, including Komar integrals, ADM mass, AdS/CFT, black-hole physics, quantum chaos, random
          matrix theory, and SYK models.
        icon: fa-solid fa-atom
        summary: >-
          The relation between quantum field theory and spacetime geometry, from conserved quantities such as
          Komar integrals and ADM mass to holographic duality in AdS/CFT. I am also interested in how black-hole
          physics connects quantum chaos, random matrix theory, and SYK models.

