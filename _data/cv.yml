    Presentations & Posters:
      - name: "The Power of Symmetry: From Rotations to Particles, Forces, and Gravity"
        bullet: >-
          **The Power of Symmetry: From Rotations to Particles, Forces, and Gravity** — Joint presentation with
          Drim Choi and Seokwon Lee at CERN (July 2026). Presented Part III, “Massless Spin-2 and Einstein
          Gravity,” on the route from Fierz–Pauli theory to Einstein gravity.
        date: 2026-07
        location: CERN, Geneva, Switzerland
        summary: >-
          Joint presentation with Drim Choi and Seokwon Lee at the CERN–CKC Summer Student Programme 2026.
          Presented Part III, “Massless Spin-2 and Einstein Gravity,” on how gauge invariance and the
          self-consistent coupling of a massless spin-2 field lead from Fierz–Pauli theory to Einstein gravity.
      - name: Parabolic Krylov–Safonov Harnack Inequality
        bullet: >-
          **Parabolic Krylov–Safonov Harnack Inequality** — Course final presentation for *Special Topics in
          Analysis: Regularity Methods for Nonlinear Elliptic and Parabolic Equations*, taught by Prof. Sun-Sig
          Byun (June 2026). Presented parabolic ABP estimates, measure and propagation lemmas, Vitali covering,
          level-set decay, weak Harnack and Harnack inequalities, and Hölder regularity.
        date: 2026-06
        location: SNU, Seoul, South Korea
        role: Course Final Presentation
        course: "Special Topics in Analysis: Regularity Methods for Nonlinear Elliptic and Parabolic Equations"
        instructor: Prof. Sun-Sig Byun
        source: Beomjun Choi, Parabolic Krylov–Safonov Harnack Inequality (lecture notes)
        materials_dated: "2026-06-09"
        summary: >-
          Final presentation for Prof. Sun-Sig Byun’s special-topics course on regularity methods for nonlinear
          elliptic and parabolic equations. Based on Beomjun Choi’s notes, covered parabolic ABP estimates,
          measure and propagation lemmas, Vitali covering, level-set decay, weak and full Harnack inequalities,
          and Hölder regularity.
      - name: Euler Equations on 2D Singular Domains
        bullet: >-
          **Euler Equations on 2D Singular Domains** — Course final presentation for *Special Topics in
          Analysis: Regularity Theory for Partial Differential Equations*, taught by Prof. Sun-Sig Byun
          (December 2025). Presented Yudovich well-posedness, nonsmooth boundaries and corners, log-Lipschitz
          velocity estimates, Lagrangian flow maps, and the Osgood criterion.
        date: 2025-12
        location: SNU, Seoul, South Korea
        role: Course Final Presentation
        course: "Special Topics in Analysis: Regularity Theory for Partial Differential Equations"
        instructor: Prof. Sun-Sig Byun
        source: Zonglin Han, Euler Equations on 2D Singular Domains (2023 doctoral thesis)
        materials_dated: "2025-12-08"
        summary: >-
          Final presentation for Prof. Sun-Sig Byun’s special-topics course on regularity theory for partial
          differential equations. Using Zonglin Han’s dissertation, reviewed Yudovich well-posedness on
          nonsmooth and corner domains, log-Lipschitz velocity estimates, Lagrangian flows and the Osgood
          criterion.
