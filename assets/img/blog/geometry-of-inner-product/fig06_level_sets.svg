<title id="title">A fixed diagonal and three equal-area quadrilaterals</title>
<desc id="desc">The points P1, P2, P3 lie on a line parallel to AB. The quadrilaterals OBP1A, OBP2A, OBP3A share triangle OAB. The other three triangles have common base AB and equal perpendicular heights h, so all three quadrilaterals have equal area.</desc>
