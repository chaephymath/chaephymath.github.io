<text x="78" y="808" font-size="28" text-anchor="start" fill="#263238" font-style="italic">O</text>
<text x="81" y="482" font-size="30" text-anchor="end" fill="#263238" font-style="italic">A</text>
<text x="675" y="817" font-size="30" text-anchor="start" fill="#263238" font-style="italic">B</text>
<text x="1369.0" y="788" font-size="28" text-anchor="start" fill="#263238" font-style="italic">x</text>
<text x="91" y="88.75" font-size="28" text-anchor="start" fill="#263238" font-style="italic">y</text>
<text x="274.0" y="693.0" font-size="32" text-anchor="middle" fill="#64717a" font-style="italic">OAB</text>
<text x="820" y="510" font-size="32" text-anchor="start" fill="#404a51" font-style="italic">ax + by = c</text>
<text x="950" y="150" font-size="30" text-anchor="start" fill="#64717a">[OAB] = ab / 2</text>
<text x="950" y="205" font-size="29" text-anchor="start" fill="#2c8c7b" font-style="italic">AB : ax + by = ab</text>
<text x="950" y="260" font-size="32" text-anchor="start" fill="#263238">h₁ = h₂ = h₃ = h</text>
<text x="950" y="315" font-size="29" text-anchor="start" fill="#263238">[ABP₁] = [ABP₂] = [ABP₃]</text>
<text x="990" y="354" font-size="30" text-anchor="start" fill="#263238">= ½ |AB| h</text>
<text x="950" y="408" font-size="27" text-anchor="start" fill="#263238">[OBP₁A] = [OBP₂A] = [OBP₃A]</text>
<text x="990" y="447" font-size="29" text-anchor="start" fill="#263238">= ½ ab + ½ |AB| h = c / 2</text>
<text x="950" y="89" font-size="28" text-anchor="start" fill="#263238">ℓᵤ(v₁) = ℓᵤ(v₂) = ℓᵤ(v₃) = c</text>
