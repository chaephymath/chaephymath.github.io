<text x="83" y="848" font-size="28" text-anchor="start" fill="#263238" font-style="italic">O</text>
<text x="86" y="542" font-size="30" text-anchor="end" fill="#263238" font-style="italic">A</text>
<text x="640" y="857" font-size="30" text-anchor="start" fill="#263238" font-style="italic">B</text>
<text x="860" y="828" font-size="28" text-anchor="start" fill="#263238" font-style="italic">x</text>
<text x="96" y="65" font-size="28" text-anchor="start" fill="#263238" font-style="italic">y</text>
<text x="267.0" y="739.0" font-size="32" text-anchor="middle" fill="#64717a" font-style="italic">OAB</text>
<text x="475" y="310" font-size="32" text-anchor="start" fill="#404a51" font-style="italic">ax + by = c</text>
<line x1="918" y1="193" x2="918" y2="790" stroke="#e3e7ea" stroke-width="1.5"/>
<text x="970" y="253" font-size="30" text-anchor="start" fill="#64717a">[OAB] = ab / 2</text>
<text x="970" y="330" font-size="29" text-anchor="start" fill="#2c8c7b" font-style="italic">AB : ax + by = ab</text>
<text x="970" y="407" font-size="32" text-anchor="start" fill="#263238">h₁ = h₂ = h₃ = h</text>
<text x="970" y="489" font-size="29" text-anchor="start" fill="#263238">[ABP₁] = [ABP₂] = [ABP₃]</text>
<text x="1010" y="535" font-size="30" text-anchor="start" fill="#263238">= ½ |AB| h</text>
<text x="970" y="622" font-size="27" text-anchor="start" fill="#263238">[OBP₁A] = [OBP₂A] = [OBP₃A]</text>
<text x="1010" y="668" font-size="29" text-anchor="start" fill="#263238">= ½ ab + ½ |AB| h = c / 2</text>
<text x="970" y="759" font-size="28" text-anchor="start" fill="#263238">ℓᵤ(v₁) = ℓᵤ(v₂) = ℓᵤ(v₃) = c</text>
